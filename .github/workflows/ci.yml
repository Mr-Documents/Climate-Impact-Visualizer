name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: Python ML pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the development environment. Every dependency ships a cp314
          # wheel; TensorFlow does not, which is why nothing here requires it.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: ml/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=:all: -r requirements-dev.txt

      - name: Lint
        run: ruff check src scripts tests

      - name: Format check
        run: ruff format --check src scripts tests
        continue-on-error: true

      - name: Run tests with coverage
        # No network in CI: every test that would reach the climate API is
        # mocked, so a provider outage can never turn the build red.
        run: |
          pytest --cov=climate_ml --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ml/coverage.xml
          if-no-files-found: ignore

  backend:
    name: Node backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to 18 because @tensorflow/tfjs-node's native backend is only
          # reliable there, and it imports util functions Node removed in v23.
          node-version: "18"
          cache: npm
          cache-dependency-path: Backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check every source file
        run: |
          for f in $(git ls-files '*.js' | grep -v node_modules); do
            node --check "../$f" || exit 1
          done

      - name: Run tests
        run: node --test

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        # A build failure is the signal that matters here: it catches broken
        # imports and JSX errors that unit tests would not.
        run: CI=false npm run build
