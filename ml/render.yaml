# Render deployment for the Python ML service.
#
# ARCHITECTURE
#   React (Vercel) -> Node/Express (Render, public) -> this service (Render, internal)
#
# Express is the intended entry point: it owns CORS, rate limiting and logging,
# and the frontend only ever calls Express. Set ML_SERVICE_URL on the Node
# service to this service's address.
#
# CAVEAT - on Render's FREE plan this service is nonetheless publicly reachable.
# Private Services are a paid feature, so `type: web, plan: free` gets a public
# HTTPS URL whether or not anything links to it. Treat the URL as unlisted, not
# private. It exposes no credentials and no write path - /predict takes a
# latitude and longitude and returns two probabilities - so the exposure is
# unauthenticated read of the same numbers Express already serves. To make it
# genuinely private, move to a paid Private Service and use the internal address.
#
# COLD START - free instances spin down after ~15 minutes idle. The first
# request after that pays Render's container boot (tens of seconds) on top of
# this service's own ~4 s history fetch, which can exceed the Node side's
# ML_TIMEOUT_MS (default 45000) and make the dashboard fall back to the rule
# based path. Raise ML_TIMEOUT_MS, or accept the occasional first-request
# fallback, or use a paid plan that does not sleep.
#
# WHY NO DOCKERFILE
# Render's native Python runtime installs from requirements.txt directly. A
# Dockerfile would add a build step and an image to maintain without changing
# the result. The dependency list is pure-wheel, so nothing needs compiling.
#
# MEMORY
# The models total 30.4 MB on disk and load to roughly 150-200 MB resident with
# pandas and scikit-learn. That fits the 512 MB free tier with headroom. It only
# fits because the random forest is depth-capped: an unconstrained forest
# produced 557 MB of artefacts and would not have deployed at all. No TensorFlow
# is installed - no candidate model justified it.

services:
  - type: web
    name: climate-ml-api
    runtime: python
    plan: free
    region: oregon
    rootDir: ml

    # Pinned to match the development environment. Every dependency ships a
    # cp314 wheel; --only-binary makes a missing wheel fail loudly at build
    # time rather than silently attempting a source build.
    buildCommand: "pip install --only-binary=:all: -r requirements.txt"
    startCommand: "uvicorn climate_ml.api.service:app --host 0.0.0.0 --port $PORT --app-dir src"

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: LOG_LEVEL
        value: INFO
      # One worker only. Each worker loads its own copy of both models, so two
      # workers would double the memory for no throughput gain on a single-core
      # free instance.
      - key: WEB_CONCURRENCY
        value: "1"
